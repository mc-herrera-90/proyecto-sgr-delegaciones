<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión — Municipalidad de La Serena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0f2a43;
    --navy-dark: #0a1d30;
    --gold: #c9962c;
    --bg: #eef1f5;
    --text: #1c2b3a;
    --muted: #64748b;
    --error: #b3261e;
    --error-bg: #fdecea;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    font-family: 'Inter', sans-serif;
    color: var(--text);
  }

  header {
    background: var(--navy);
    color: #fff;
    padding: 1rem 1.5rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .emblem {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Lora', serif;
    font-weight: 700;
    color: var(--navy-dark);
    font-size: 0.95rem;
    flex-shrink: 0;
  }

  header .titles { line-height: 1.25; }
  header .titles .eyebrow { font-size: 0.72rem; color: #cbd6e2; }
  header .titles .name { font-family: 'Lora', serif; font-weight: 600; font-size: 1rem; }

  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
  }

  .card {
    width: 100%;
    max-width: 380px;
    background: #fff;
    border-radius: 10px;
    padding: 2.25rem 2rem;
    box-shadow: 0 8px 24px rgba(15, 42, 67, 0.08);
    border-top: 4px solid var(--gold);
  }

  h1 {
    font-family: 'Lora', serif;
    font-size: 1.4rem;
    margin: 0 0 0.35rem 0;
    color: var(--navy);
  }

  .subtitle {
    margin: 0 0 1.5rem 0;
    font-size: 0.9rem;
    color: var(--muted);
  }

  .field {
    margin-bottom: 1.1rem;
    display: flex;
    flex-direction: column;
  }

  label {
    font-size: 0.82rem;
    font-weight: 600;
    margin-bottom: 0.35rem;
  }

  input {
    padding: 0.65rem 0.8rem;
    border: 1px solid #d3dae3;
    border-radius: 7px;
    font-size: 1rem;
    font-family: inherit;
    color: var(--text);
  }

  input:focus {
    outline: none;
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(201, 150, 44, 0.18);
  }

  .error-box {
    display: none;
    background: var(--error-bg);
    color: var(--error);
    border: 1px solid #f3c6c2;
    border-radius: 7px;
    padding: 0.6rem 0.8rem;
    font-size: 0.85rem;
    margin-bottom: 1rem;
  }

  .error-box.show { display: block; }

  button {
    width: 100%;
    padding: 0.75rem;
    background: var(--navy);
    color: #fff;
    border: none;
    border-radius: 7px;
    font-size: 1rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    margin-top: 0.25rem;
    transition: background-color 0.15s ease;
  }

  button:hover { background: var(--navy-dark); }

  .hint {
    text-align: center;
    margin-top: 1.1rem;
    font-size: 0.78rem;
    color: var(--muted);
  }

  footer {
    text-align: center;
    padding: 1rem;
    font-size: 0.75rem;
    color: var(--muted);
  }
</style>
</head>
<body>

  <header>
    <div class="emblem">MLS</div>
    <div class="titles">
      <div class="eyebrow">Ilustre Municipalidad de</div>
      <div class="name">La Serena</div>
    </div>
  </header>

  <main>
    <div class="card">
      <h1>Iniciar sesión</h1>
      <p class="subtitle">Ingresa con tu RUT y contraseña para acceder al sistema.</p>

      <div class="error-box" id="errorBox">
        Credenciales inválidas. Verifica tu RUT y contraseña e inténtalo nuevamente.
      </div>

      <form id="loginForm">
        <div class="field">
          <label for="rut">RUT</label>
          <input type="text" id="rut" name="rut" placeholder="12.345.678-9" autocomplete="username" required>
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
        </div>

        <button type="submit">Iniciar sesión</button>
      </form>

      <p class="hint">Prueba: RUT 14108603-0 · contraseña Demo2026*</p>
    </div>
  </main>

  <footer>&copy; 2026 Ilustre Municipalidad de La Serena</footer>

  <script>
    // Demo simple en el navegador, solo para visualizar el flujo.
    // La validación real vive en el backend (Django), no aquí.
    const DEMO_RUT = "14108603-0";
    const DEMO_PASSWORD = "Demo2026*";

    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const rut = document.getElementById('rut').value.trim();
      const password = document.getElementById('password').value;
      const errorBox = document.getElementById('errorBox');

      if (rut === DEMO_RUT && password === DEMO_PASSWORD) {
        errorBox.classList.remove('show');
        alert('Inicio de sesión exitoso (demo).');
      } else {
        errorBox.classList.add('show');
      }
    });
  </script>

</body>
</html>
